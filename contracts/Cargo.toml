[workspace]
resolver = "2"
members = ["counter", "deposit", "onboard"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
# Testnet and mainnet run protocol 29 (getNetwork, 2026-10-25); the SDK major tracks the protocol.
soroban-sdk = "29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# https://developers.stellar.org/docs/build/smart-contracts/example-contracts/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
