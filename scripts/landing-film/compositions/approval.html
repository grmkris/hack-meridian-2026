    const tl = gsap.timeline({ paused: true })
    // Each payment travels in front of the ledger, over the letter, and into the recipient's orbit.

        selector,
        { x: 0, y: 0, opacity: 0, rotation: -25 },
        { x: 180, y: -160, opacity: 1, rotation: 0, duration: 0.7, ease: 'power1.out' },
        start,

      tl.to(selector, { x: 1000, y: 30, opacity: 0, rotation: 55, duration: 0.7, ease: 'power1.in' }, start + 1.6)
    }
    smallPayment('#small-one', 0.25)
    smallPayment('#small-two', 1.25)
    tl.fromTo(
      '#large',
      { x: 0, y: 0, opacity: 0, rotation: -25 },

      2.7,

    tl.fromTo('#waiting', { opacity: 0 }, { opacity: 1, duration: 0.25 }, 3.6)

    tl.to('#large', { scale: 0.94, duration: 0.15, ease: 'power2.out' }, 5.0)

    tl.to('#waiting', { opacity: 0, duration: 0.2 }, 5.08)
    tl.fromTo('#approved', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.3)
    tl.to('#finger', { x: 0, y: 0, duration: 0.7, ease: 'power2.inOut' }, 5.3)
    tl.to('#large', { x: 1000, y: -40, opacity: 0, rotation: 35, duration: 1.15, ease: 'power2.in' }, 5.55)
    tl.to(['#approval-mark', '#approved'], { opacity: 0, duration: 0.6 }, 6.9)
