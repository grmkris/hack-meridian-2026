<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"night","type":"color","label":"Night","default":"#0b1429"},{"id":"lamp","type":"color","label":"Approval","default":"#edc36d"}]'
>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night, #0b1429);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="hf-gxr6"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div
        data-hf-id="hf-x5zy"
        id="approval"
        class="clip"
        data-composition-id="approval"
        data-composition-src="compositions/approval.html"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {}
      window.__timelines.main = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
