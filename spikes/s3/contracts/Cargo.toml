# S3 spike workspace, separate from contracts/ on purpose (spike agents must not touch it).
# Build: export CARGO_TARGET_DIR=/srv/cache/hm26-target/s3 && heavy stellar contract build
[workspace]
resolver = "2"
members = ["onboard"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
soroban-sdk = "29.0.1"

# Copied from contracts/Cargo.toml
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
