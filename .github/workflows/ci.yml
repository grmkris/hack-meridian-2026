name: CI

# Every push to main and every pull request runs the full gate on GitHub's hosted runners (the repository is public).
# Nothing here deploys: the testnet Worker is deployed by hand from the build box with `bun run deploy:testnet`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Rust components
        run: rustup component add clippy rustfmt
      - run: bun install --frozen-lockfile
      - name: Fetch and verify pinned type-aware lint backend
        run: bun scripts/tsrs-lint.ts
      - run: bun run check
