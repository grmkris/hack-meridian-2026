        <h1>Nod: give your AI an allowance</h1>
        <p>
          Nod is a Stellar wallet that lives inside the AI you already use. You give each AI app one allowance, say 5
          USDC until tomorrow. Inside it, the app pays for APIs and pays people on its own. Anything past it needs your
          passkey, every time, for any amount. The allowance is an OpenZeppelin spending-limit policy on your own
          Stellar account. The product runs on Stellar mainnet at trynod.si; the sandbox at testnet.trynod.si runs on
          testnet. Built at HackMeridian 2026.
        </p>
